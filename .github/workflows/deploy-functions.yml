name: deploy supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Push DB migrations
        run: supabase db push --linked --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Deploy edge functions
        run: |
          supabase functions deploy auth --no-verify-jwt
          supabase functions deploy chat --no-verify-jwt
          supabase functions deploy confirm --no-verify-jwt
          supabase functions deploy data --no-verify-jwt
          supabase functions deploy manual --no-verify-jwt
